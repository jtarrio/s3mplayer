<!DOCTYPE html>
<html>
  <body>
    <script type="module">
      import { ParseS3M } from "../dist/s3m.js";
      import { Player } from "../dist/player.js";

      let stop = true;
      let the_song;

      // fetch("./2nd_sk.s3m")
      // fetch("./2nd_pm.s3m")
        fetch("./tones.s3m")
        .then((response) => response.arrayBuffer())
        .then((s3m) => ParseS3M(new Uint8Array(s3m)))
        .then((song) => {
          the_song = new Player(song);
          // the_song.order = 4;
          the_song.addEventListener("before-play", onBeforePlay);
        });

      document.getElementById("playbtn").onclick = () => {
        the_song.play();
      };

      document.getElementById("stopbtn").onclick = () => {
        the_song.stop();
      };

      function onBeforePlay(e) {
        console.log(e.detail.order, e.detail.row);
        document.getElementById("measure").textContent = `> ${JSON.stringify(
          e.detail
        )}`;
      }
    </script>

    <input id="playbtn" type="button" value="Play" />
    <input id="stopbtn" type="button" value="Stop" />
    <div id="measure"></div>
  </body>
</html>
